schema: 3
id: homeassistant
name: Home Assistant
image:
  repository: ghcr.io/home-assistant/home-assistant
runtime:
  ports:
    - name: http
      port: 8123
      protocol: tcp
  healthcheck:
    type: http
    port: http
    path: /auth/providers
    expected_status: 200
persistence:
  mount: /config
  size: 10G
exposure:
  pangolin:
    port: http
    name: Home Assistant
    subdomain: homeassistant
